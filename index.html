<!DOCTYPE html>
<html>
  <head>
    <title>My First Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: "Nunito", "Trebuchet MS", sans-serif;
        text-align: center;
        padding-top: 80px;
      }
      h1 {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 4rem;
        font-weight: 800;
        margin: 0;
      }
      .letter, .smiley {
        display: inline-block;
        opacity: 0;
        animation-fill-mode: forwards;
      }
      .letter {
        transform: translateY(30px);
        animation-name: reveal;
        animation-duration: 0.6s;
        animation-timing-function: ease;
      }
      .space {
        display: inline-block;
        width: 0.35em;
      }
      .smiley {
        margin-left: 0.2em;
        animation-name: pop;
        animation-duration: 0.8s;
        animation-delay: 2.4s;
      }
      @keyframes reveal {
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes pop {
        0%   { opacity: 0; transform: scale(0) rotate(-30deg); }
        70%  { opacity: 1; transform: scale(1.4) rotate(10deg); }
        100% { opacity: 1; transform: scale(1) rotate(0); }
      }
    </style>
  </head>
  <body>
    <h1>
      <span class="letter" style="color:#ff3b30; animation-delay:0.2s">H</span>
      <span class="letter" style="color:#ff9500; animation-delay:0.4s">e</span>
      <span class="letter" style="color:#ffcc00; animation-delay:0.6s">l</span>
      <span class="letter" style="color:#34c759; animation-delay:0.8s">l</span>
      <span class="letter" style="color:#00c7be; animation-delay:1.0s">o</span>
      <span class="space"></span>
      <span class="letter" style="color:#007aff; animation-delay:1.2s">W</span>
      <span class="letter" style="color:#5856d6; animation-delay:1.4s">o</span>
      <span class="letter" style="color:#af52de; animation-delay:1.6s">r</span>
      <span class="letter" style="color:#ff2d92; animation-delay:1.8s">l</span>
      <span class="letter" style="color:#ff3b30; animation-delay:2.0s">d</span>
      <span class="smiley">😊</span>
    </h1>
  </body>
</html>
